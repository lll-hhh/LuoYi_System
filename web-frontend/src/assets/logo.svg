<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="truckGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#409EFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#67C23A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 卡车车身 -->
  <rect x="20" y="80" width="100" height="60" rx="5" fill="url(#truckGradient)"/>
  
  <!-- 驾驶室 -->
  <rect x="120" y="90" width="60" height="50" rx="5" fill="url(#truckGradient)"/>
  
  <!-- 车窗 -->
  <rect x="130" y="95" width="40" height="25" rx="3" fill="#E8F4FF"/>
  
  <!-- 车轮 -->
  <circle cx="55" cy="145" r="18" fill="#333"/>
  <circle cx="55" cy="145" r="10" fill="#666"/>
  <circle cx="150" cy="145" r="18" fill="#333"/>
  <circle cx="150" cy="145" r="10" fill="#666"/>
  
  <!-- 道路 -->
  <rect x="0" y="160" width="200" height="20" fill="#4A4A4A"/>
  <line x1="0" y1="170" x2="200" y2="170" stroke="#FFF" stroke-width="2" stroke-dasharray="10,10"/>
  
  <!-- 络绎文字 -->
  <text x="100" y="55" font-family="Arial, sans-serif" font-size="28" font-weight="bold" 
        fill="url(#truckGradient)" text-anchor="middle">络绎</text>
  <text x="100" y="195" font-family="Arial, sans-serif" font-size="12" 
        fill="#666" text-anchor="middle">Lorries System</text>
</svg>
