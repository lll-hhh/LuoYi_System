name: luoyi_mobile
description: 络绎智慧交通管理系统 - 移动端应用

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 网络请求
  dio: ^5.4.0
  
  # 状态管理
  provider: ^6.1.1
  
  # 路由管理
  go_router: ^13.0.0
  
  # 本地存储
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # UI组件
  flutter_spinkit: ^5.2.0
  pull_to_refresh: ^2.0.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  
  # 图标
  cupertino_icons: ^1.0.6
  flutter_vector_icons: ^2.0.0
  
  # 定位和地图
  geolocator: ^10.1.0
  
  # 扫码
  mobile_scanner: ^3.5.5
  
  # 图片选择
  image_picker: ^1.0.5
  
  # 工具类
  intl: ^0.18.1
  json_annotation: ^4.8.1
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
  
  fonts:
    - family: PingFang
      fonts:
        - asset: assets/fonts/PingFang-Regular.ttf
        - asset: assets/fonts/PingFang-Medium.ttf
          weight: 500
        - asset: assets/fonts/PingFang-Bold.ttf
          weight: 700
