# 络绎智慧交通管理系统 - Docker Compose 配置
# Lorries Intelligent Transportation Management System

services:
  # ==================== 数据库 ====================
  
  # 枢纽端 PostgreSQL
  hub-postgres:
    image: postgres:16-alpine
    container_name: lorries-hub-postgres
    environment:
      POSTGRES_DB: ${HUB_DB_NAME}
      POSTGRES_USER: ${HUB_DB_USER}
      POSTGRES_PASSWORD: ${HUB_DB_PASSWORD}
    volumes:
      - hub-postgres-data:/var/lib/postgresql/data
      - ./database/hub:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - lorries-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HUB_DB_USER} -d ${HUB_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 移动端 PostgreSQL
  mobile-postgres:
    image: postgres:16-alpine
    container_name: lorries-mobile-postgres
    environment:
      POSTGRES_DB: ${MOBILE_DB_NAME}
      POSTGRES_USER: ${MOBILE_DB_USER}
      POSTGRES_PASSWORD: ${MOBILE_DB_PASSWORD}
    volumes:
      - mobile-postgres-data:/var/lib/postgresql/data
      - ./database/mobile:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    networks:
      - lorries-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MOBILE_DB_USER} -d ${MOBILE_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== 缓存与消息队列 ====================
  
  # Redis
  redis:
    image: redis:7-alpine
    container_name: lorries-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - lorries-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: lorries-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - lorries-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 30s
      timeout: 10s
      retries: 5

  # MinIO 对象存储
  minio:
    image: minio/minio:latest
    container_name: lorries-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - lorries-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ==================== 后端服务 ====================
  
  # 枢纽端后端
  hub-backend:
    build:
      context: ./hub-backend
      dockerfile: Dockerfile
    container_name: lorries-hub-backend
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=${HUB_DB_HOST}
      - DB_PORT=${HUB_DB_PORT}
      - DB_NAME=${HUB_DB_NAME}
      - DB_USER=${HUB_DB_USER}
      - DB_PASSWORD=${HUB_DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
    ports:
      - "${HUB_BACKEND_PORT}:8080"
    networks:
      - lorries-network
    depends_on:
      hub-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # 移动端后端
  mobile-backend:
    build:
      context: ./mobile-backend
      dockerfile: Dockerfile
    container_name: lorries-mobile-backend
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=${MOBILE_DB_HOST}
      - DB_PORT=${MOBILE_DB_PORT}
      - DB_NAME=${MOBILE_DB_NAME}
      - DB_USER=${MOBILE_DB_USER}
      - DB_PASSWORD=${MOBILE_DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
    ports:
      - "${MOBILE_BACKEND_PORT}:8080"
    networks:
      - lorries-network
    depends_on:
      mobile-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # 算法服务接口
  algorithm-service:
    build:
      context: ./algorithm-service
      dockerfile: Dockerfile
    container_name: lorries-algorithm-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
    ports:
      - "${ALGORITHM_SERVICE_PORT}:8090"
    networks:
      - lorries-network
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # ==================== 前端 ====================
  
  # Web前端
  web-frontend:
    build:
      context: ./web-frontend
      dockerfile: Dockerfile
    container_name: lorries-web-frontend
    ports:
      - "${WEB_FRONTEND_PORT}:80"
    networks:
      - lorries-network
    depends_on:
      - hub-backend
    restart: unless-stopped

  # ==================== 反向代理 ====================
  
  # Nginx
  nginx:
    image: nginx:alpine
    container_name: lorries-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - lorries-network
    depends_on:
      - hub-backend
      - mobile-backend
      - web-frontend
    restart: unless-stopped

  # RTMP/HLS 视频流服务器
  rtmp-server:
    build:
      context: ./nginx
      dockerfile: Dockerfile.rtmp
    container_name: lorries-rtmp-server
    volumes:
      - rtmp-hls-data:/var/www/hls
      - rtmp-recordings:/var/www/recordings
    ports:
      - "1935:1935"    # RTMP推流端口
      - "8088:8088"    # HLS播放端口
    networks:
      - lorries-network
    depends_on:
      - hub-backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ==================== 监控 ====================
  
  # Prometheus 监控采集
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: lorries-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - lorries-network
    depends_on:
      - hub-backend
      - mobile-backend
    restart: unless-stopped

  # Grafana 可视化仪表板
  grafana:
    image: grafana/grafana:10.1.0
    container_name: lorries-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - lorries-network
    depends_on:
      - prometheus
    restart: unless-stopped

  # PostgreSQL Exporter
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.14.0
    container_name: lorries-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${HUB_DB_USER}:${HUB_DB_PASSWORD}@hub-postgres:5432/${HUB_DB_NAME}?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - lorries-network
    depends_on:
      hub-postgres:
        condition: service_healthy
    restart: unless-stopped

  # Redis Exporter
  redis-exporter:
    image: oliver006/redis_exporter:v1.55.0
    container_name: lorries-redis-exporter
    environment:
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    ports:
      - "9121:9121"
    networks:
      - lorries-network
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Alertmanager 告警管理
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: lorries-alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
    ports:
      - "9093:9093"
    networks:
      - lorries-network
    restart: unless-stopped

# ==================== 网络 ====================
networks:
  lorries-network:
    driver: bridge

# ==================== 数据卷 ====================
volumes:
  hub-postgres-data:
  mobile-postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  rtmp-hls-data:
  rtmp-recordings:
  prometheus-data:
  grafana-data:
  alertmanager-data:
