version: '3.8'

services:
  # ==================== 数据库 ====================
  
  # 枢纽端 PostgreSQL
  hub-postgres:
    image: postgres:16-alpine
    container_name: lorries-hub-postgres
    environment:
      POSTGRES_DB: ${HUB_DB_NAME}
      POSTGRES_USER: ${HUB_DB_USER}
      POSTGRES_PASSWORD: ${HUB_DB_PASSWORD}
    volumes:
      - hub-postgres-data:/var/lib/postgresql/data
      - ./database/hub:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - lorries-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HUB_DB_USER} -d ${HUB_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 移动端 PostgreSQL
  mobile-postgres:
    image: postgres:16-alpine
    container_name: lorries-mobile-postgres
    environment:
      POSTGRES_DB: ${MOBILE_DB_NAME}
      POSTGRES_USER: ${MOBILE_DB_USER}
      POSTGRES_PASSWORD: ${MOBILE_DB_PASSWORD}
    volumes:
      - mobile-postgres-data:/var/lib/postgresql/data
      - ./database/mobile:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    networks:
      - lorries-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MOBILE_DB_USER} -d ${MOBILE_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== 缓存与消息队列 ====================
  
  # Redis
  redis:
    image: redis:7-alpine
    container_name: lorries-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - lorries-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: lorries-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - lorries-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 30s
      timeout: 10s
      retries: 5

  # MinIO 对象存储
  minio:
    image: minio/minio:latest
    container_name: lorries-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - lorries-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ==================== 后端服务 ====================
  
  # 枢纽端后端
  hub-backend:
    build:
      context: ./hub-backend
      dockerfile: Dockerfile
    container_name: lorries-hub-backend
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=${HUB_DB_HOST}
      - DB_PORT=${HUB_DB_PORT}
      - DB_NAME=${HUB_DB_NAME}
      - DB_USER=${HUB_DB_USER}
      - DB_PASSWORD=${HUB_DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
    ports:
      - "${HUB_BACKEND_PORT}:8080"
    networks:
      - lorries-network
    depends_on:
      hub-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # 移动端后端
  mobile-backend:
    build:
      context: ./mobile-backend
      dockerfile: Dockerfile
    container_name: lorries-mobile-backend
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=${MOBILE_DB_HOST}
      - DB_PORT=${MOBILE_DB_PORT}
      - DB_NAME=${MOBILE_DB_NAME}
      - DB_USER=${MOBILE_DB_USER}
      - DB_PASSWORD=${MOBILE_DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
    ports:
      - "${MOBILE_BACKEND_PORT}:8080"
    networks:
      - lorries-network
    depends_on:
      mobile-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # 算法服务接口
  algorithm-service:
    build:
      context: ./algorithm-service
      dockerfile: Dockerfile
    container_name: lorries-algorithm-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
    ports:
      - "${ALGORITHM_SERVICE_PORT}:8080"
    networks:
      - lorries-network
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # ==================== 前端 ====================
  
  # Web前端
  web-frontend:
    build:
      context: ./web-frontend
      dockerfile: Dockerfile
    container_name: lorries-web-frontend
    ports:
      - "${WEB_FRONTEND_PORT}:80"
    networks:
      - lorries-network
    depends_on:
      - hub-backend
    restart: unless-stopped

  # ==================== 反向代理 ====================
  
  # Nginx
  nginx:
    image: nginx:alpine
    container_name: lorries-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - lorries-network
    depends_on:
      - hub-backend
      - mobile-backend
      - web-frontend
    restart: unless-stopped

# ==================== 网络 ====================
networks:
  lorries-network:
    driver: bridge

# ==================== 数据卷 ====================
volumes:
  hub-postgres-data:
  mobile-postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
