# Alertmanager配置文件
# 络绎智慧交通管理系统 - 告警管理配置

global:
  # SMTP邮件配置（按需配置）
  smtp_smarthost: 'smtp.example.com:587'
  smtp_from: 'alertmanager@lorries.com'
  smtp_auth_username: 'alertmanager@lorries.com'
  smtp_auth_password: 'your-password'
  smtp_require_tls: true
  
  # 默认解决超时
  resolve_timeout: 5m

# 告警路由
route:
  # 默认接收者
  receiver: 'default-receiver'
  
  # 分组配置
  group_by: ['alertname', 'severity', 'instance']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  
  # 子路由
  routes:
    # 紧急告警
    - match:
        severity: critical
      receiver: 'critical-receiver'
      group_wait: 10s
      repeat_interval: 1h
    
    # 警告告警
    - match:
        severity: warning
      receiver: 'warning-receiver'
      group_wait: 1m
      repeat_interval: 2h
    
    # 数据库相关告警
    - match:
        job: postgresql
      receiver: 'database-receiver'
      group_by: ['alertname', 'instance']
    
    # 服务相关告警
    - match_re:
        job: hub-backend|mobile-backend|algorithm-service
      receiver: 'service-receiver'

# 接收者配置
receivers:
  # 默认接收者（webhook）
  - name: 'default-receiver'
    webhook_configs:
      - url: 'http://hub-backend:8081/api/hub/alerts/webhook'
        send_resolved: true

  # 紧急告警接收者
  - name: 'critical-receiver'
    webhook_configs:
      - url: 'http://hub-backend:8081/api/hub/alerts/webhook'
        send_resolved: true
    # 可添加邮件、短信等配置
    # email_configs:
    #   - to: 'ops-team@lorries.com'
    #     send_resolved: true

  # 警告告警接收者
  - name: 'warning-receiver'
    webhook_configs:
      - url: 'http://hub-backend:8081/api/hub/alerts/webhook'
        send_resolved: true

  # 数据库告警接收者
  - name: 'database-receiver'
    webhook_configs:
      - url: 'http://hub-backend:8081/api/hub/alerts/webhook'
        send_resolved: true

  # 服务告警接收者
  - name: 'service-receiver'
    webhook_configs:
      - url: 'http://hub-backend:8081/api/hub/alerts/webhook'
        send_resolved: true

# 抑制规则
inhibit_rules:
  # 当critical告警触发时，抑制相同实例的warning告警
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
  
  # 当服务宕机时，抑制该服务的其他告警
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: '.+'
    equal: ['instance']

# 模板配置
templates:
  - '/etc/alertmanager/templates/*.tmpl'
