# Grafana Dashboard Provisioning
# 络绎智慧交通管理系统

apiVersion: 1

providers:
  - name: 'Lorries Dashboards'
    orgId: 1
    folder: '络绎监控'
    folderUid: 'lorries'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
