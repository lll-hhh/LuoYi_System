# Nginx RTMP/HLS 视频流服务器配置
# 用于处理摄像头视频流的接收、转码和分发

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# 加载RTMP模块
load_module modules/ngx_rtmp_module.so;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

# RTMP服务配置
rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        
        # 直播应用 - 接收摄像头推流
        application live {
            live on;
            record off;
            
            # 允许从任何地址推流（生产环境应限制）
            allow publish all;
            allow play all;
            
            # 推流开始时的回调
            on_publish http://hub-backend:8080/api/rtmp/on_publish;
            
            # 推流结束时的回调
            on_publish_done http://hub-backend:8080/api/rtmp/on_publish_done;
            
            # HLS转码配置
            hls on;
            hls_path /var/www/hls;
            hls_fragment 3s;
            hls_playlist_length 60s;
            hls_cleanup on;
            hls_nested on;
            
            # 视频转码设置
            exec_push ffmpeg -i rtmp://localhost:1935/live/$name
                -c:v libx264 -preset veryfast -tune zerolatency
                -c:a aac -b:a 128k
                -f flv rtmp://localhost:1935/hls/$name_720p
                -c:v libx264 -preset veryfast -tune zerolatency -s 480x360
                -c:a aac -b:a 64k
                -f flv rtmp://localhost:1935/hls/$name_360p;
        }
        
        # HLS应用 - 提供多码率流
        application hls {
            live on;
            hls on;
            hls_path /var/www/hls;
            hls_fragment 2s;
            hls_playlist_length 30s;
            hls_nested on;
            
            # 自适应码率变体
            hls_variant _720p BANDWIDTH=2000000,RESOLUTION=1280x720;
            hls_variant _360p BANDWIDTH=500000,RESOLUTION=480x360;
        }
        
        # 录制应用 - 用于视频存档
        application record {
            live on;
            record all;
            record_path /var/www/recordings;
            record_suffix -%Y%m%d-%H%M%S.flv;
            record_unique on;
            record_max_size 500M;
            
            # 录制完成后通知后端
            exec_record_done ffmpeg -i $path -c copy $dirname/$basename.mp4;
            on_record_done http://hub-backend:8080/api/rtmp/on_record_done;
        }
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/rss+xml application/atom+xml image/svg+xml
               application/vnd.apple.mpegurl video/mp2t;

    # HLS视频流服务
    server {
        listen 8088;
        server_name localhost;

        # HLS流播放
        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            alias /var/www/hls;
            
            # CORS配置
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, OPTIONS';
            add_header Access-Control-Allow-Headers 'Range,DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';
        }

        # 录制文件访问
        location /recordings {
            alias /var/www/recordings;
            autoindex on;
            add_header Access-Control-Allow-Origin *;
        }

        # RTMP统计信息
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }

        location /stat.xsl {
            root /var/www/rtmp;
        }

        # 健康检查
        location /health {
            access_log off;
            return 200 "RTMP Server OK\n";
            add_header Content-Type text/plain;
        }
    }

    # 包含主配置
    include /etc/nginx/conf.d/*.conf;
}
