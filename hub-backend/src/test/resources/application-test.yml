spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  redis:
    host: localhost
    port: 6379

  rabbitmq:
    host: localhost
    port: 5672

# JWT配置
jwt:
  secret: testSecretKeyForJwtTokenTestingPurposeOnly12345678901234567890
  expiration: 86400000

# MyBatis-Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# MinIO配置（测试用）
minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: test

# 算法服务配置
algorithm:
  service:
    url: http://localhost:8090

# 日志级别
logging:
  level:
    root: INFO
    com.lorries.hub: DEBUG
